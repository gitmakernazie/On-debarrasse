<!-- Ne rediriger vers cette confirmation en production qu’après un envoi réellement réussi. Aucun service d’envoi n’est connecté. -->
<script data-od-measurement="disabled">
/* Préparation uniquement. Aucun SDK Google, aucune requête, aucun cookie,
   aucun stockage, aucune file d'attente ni donnée personnelle. */
(() => {
 'use strict';
 const enabled = false; // À activer uniquement lors d'une intégration distincte approuvée.
 const events = Object.freeze({
  quote_click: 'quote_cta_click',
  form_success: 'generate_lead',
  phone_click: 'phone_click',
  appointment_success: 'appointment_request',
  payment_success: 'purchase'
 });
 // Adaptateur inactif. L'intégration future doit fournir le routage GA4/Ads
 // et vérifier le consentement avant toute transmission.
 const adapter = null;
 const consentGranted = () => false;
 const sent = new Set();
 function emit(name, params, key) {
  if (!enabled || !adapter || !consentGranted()) return false;
  if (key && sent.has(key)) return false;
  adapter(name, params);
  if (key) sent.add(key);
  return true;
 }
 function confirmed(kind, result) {
  // Appeler uniquement après succès confirmé côté serveur/prestataire.
  // Ne jamais appeler depuis un simple clic, submit ou affichage de confirmation.
  if (!result || result.success !== true || result.demo !== false ||
      typeof result.event_id !== 'string' || !/^[A-Za-z0-9_-]{8,128}$/.test(result.event_id)) return false;
  const params = {page_key: PAGE_KEY};
  if (kind === 'payment_success') {
   if (!Number.isFinite(result.value) || result.value < 0 || result.currency !== 'CAD') return false;
   params.transaction_id = result.event_id;
   params.value = result.value;
   params.currency = 'CAD';
  }
  return emit(events[kind], params, kind + ':' + result.event_id);
 }
 const PAGE_KEY = 'confirmation';
 window.OnDebarrasseMeasurement = Object.freeze({
  enabled, events,
  formSuccess: result => confirmed('form_success', result),
  appointmentSuccess: result => confirmed('appointment_success', result),
  paymentSuccess: result => confirmed('payment_success', result)
 });
 document.addEventListener('click', event => {
  const target = event.target instanceof Element ? event.target.closest('a,button') : null;
  if (!target) return;
  if (target.dataset.odTrack === 'quote_cta_click') {
   emit(events.quote_click, {page_key: PAGE_KEY, cta_location: target.dataset.odLocation});
  } else if (target.matches('a[href^="tel:"]')) {
   // Ne transmettre ni numéro, ni URL, ni texte de lien.
   emit(events.phone_click, {page_key: PAGE_KEY});
  }
 });
})();
</script><script src="suivi.js" defer></script></body>
