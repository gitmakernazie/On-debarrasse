<!doctype html>
<html lang="fr-CA"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob: https://lizpwezdfiwgpkdqpfsp.supabase.co; connect-src https://lizpwezdfiwgpkdqpfsp.supabase.co; form-action 'none'; base-uri 'none'">
<title>On Débarrasse — Gestion des demandes</title>
<style>
:root{--ink:#141614;--green:#98e619;--green-d:#527000;--bg:#f3f4f2;--line:#d9ded6;--muted:#555c53;--white:#fff;--red:#b3261e;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--green)}
header.top strong{font-size:18px;letter-spacing:.2px}
header.top span{color:#c9d0c3;font-size:13px}
button{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;transition:transform .15s var(--ease),background-color .2s,border-color .2s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--green);border-color:var(--green);color:var(--ink);box-shadow:0 3px 0 #5b8d08}
button.primary:active:not(:disabled){box-shadow:0 1px 0 #5b8d08}
button.danger{color:var(--red);border-color:#e6c1be}
button.ghost{background:transparent;border-color:#4a5148;color:#fff;min-height:38px;padding:0 14px;font-size:14px}
@media(hover:hover){button:hover:not(:disabled){border-color:#aeb6a6;background:#f7f8f6}button.primary:hover:not(:disabled){background:#a9ef39}}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;color:var(--ink);text-decoration:none}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:none;border-color:var(--green-d);box-shadow:0 0 0 4px #98e61940}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.muted{color:var(--muted);margin:0}
/* Connexion */
.login{max-width:420px;margin:48px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 14px 28px -16px #14161426}
.login h1{font-size:26px}
.login .field{margin-top:16px}
.login button{width:100%;margin-top:22px}
.msg{min-height:22px;margin:12px 0 0;font-size:14px;color:var(--red)}
.msg.ok{color:var(--green-d)}
/* Statistiques */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;border-left:5px solid var(--green)}
.stat strong{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
/* Filtres */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:18px}
/* Liste */
.list{display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:grid;gap:6px;text-align:left;width:100%;min-height:0;font-weight:400;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
@media(hover:hover) and (pointer:fine){.card:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px #14161430;border-color:#b5d98a}}
.card .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .name{font-weight:800;font-size:17px}
.card .meta{font-size:14px;color:var(--muted)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;background:#eef1ea;border:1px solid #d9e6c6}
.s-nouvelle{background:var(--green);border-color:var(--green)}
.s-contactee{background:#fff6cf;border-color:#ecd98a}
.s-soumission_envoyee{background:#e3eefb;border-color:#b7cfee}
.s-planifiee{background:var(--ink);color:#fff;border-color:var(--ink)}
.s-terminee{background:#e7eae4}
.s-refusee{background:#f8e1df;border-color:#e6c1be}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
/* Fiche */
dialog{border:none;border-radius:18px;padding:0;width:min(720px,calc(100vw - 20px));max-height:calc(100vh - 20px);box-shadow:0 30px 70px -20px #000a}
dialog::backdrop{background:#141614b3}
.sheet{padding:22px;display:grid;gap:16px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet h2{margin:0;font-size:22px}
.close{min-height:40px;padding:0 14px}
dl{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin:0}
dt{color:var(--muted);font-size:13px;font-weight:700}
dd{margin:0;overflow-wrap:anywhere}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photos a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.edit .full{grid-column:1/-1}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}h1{font-size:26px}}
@media(max-width:540px){header.top span{display:none}dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:8px}.edit{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.quick{grid-template-columns:1fr}dialog{width:100vw;max-height:100vh;border-radius:0;height:100vh}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body>
<header class="top"><strong>On Débarrasse.</strong><span>Gestion des demandes · accès privé</span><button class="ghost" id="logout" hidden>Se déconnecter</button></header>

<main>
 <section class="login" id="login">
  <h1>Connexion</h1>
  <p class="muted">Accès réservé au propriétaire.</p>
  <div class="field"><label for="email">Courriel</label><input id="email" type="email" autocomplete="username" inputmode="email"></div>
  <div class="field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div>
  <button class="primary" id="signin">Se connecter</button>
  <p class="msg" id="login-msg" role="alert"></p>
 </section>

 <section id="app" hidden>
  <h1>Vos demandes de soumission</h1>
  <p class="muted">Touchez une demande pour voir les détails, les photos et mettre à jour son suivi.</p>
  <div class="stats" id="stats"></div>
  <div class="filters">
   <div class="search"><label for="q">Recherche</label><input id="q" type="search" placeholder="Nom, téléphone, adresse…"></div>
   <div><label for="fstatut">Statut</label><select id="fstatut"></select></div>
   <div><label for="fville">Ville</label><select id="fville"></select></div>
   <button id="refresh">Actualiser</button>
  </div>
  <p class="msg" id="app-msg" role="alert"></p>
  <div class="list" id="list"></div>
 </section>
</main>

<dialog id="sheet"><div class="sheet" id="sheet-body"></div></dialog>

<script>
'use strict';
const URL_BASE = 'https://lizpwezdfiwgpkdqpfsp.supabase.co';
const KEY = 'sb_publishable_rMsK8JKSPK8pOzqdO5AUhw_QCbIA-Nr';
const BUCKET = 'soumissions-photos';
const STATUTS = [
 ['nouvelle','Nouvelle'],['contactee','Contactée'],['soumission_envoyee','Soumission envoyée'],
 ['planifiee','Planifiée'],['terminee','Terminée'],['refusee','Refusée']
];
const LABEL = Object.fromEntries(STATUTS);
const $ = id => document.getElementById(id);
let session = null, rows = [];

/* ---------- utilitaires sûrs (aucun innerHTML avec données) ---------- */
function el(tag, attrs, ...kids) {
 const n = document.createElement(tag);
 for (const [k, v] of Object.entries(attrs || {})) {
  if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
 }
 for (const kid of kids) if (kid != null) n.append(kid);
 return n;
}
const fmtDate = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('fr-CA', {day:'numeric', month:'long', year:'numeric'}) : '—';
const fmtDateTime = s => s ? new Date(s).toLocaleString('fr-CA', {dateStyle:'medium', timeStyle:'short'}) : '—';
const digits = s => String(s || '').replace(/[^\d+]/g, '');

/* ---------- session ---------- */
function saveSession(s) {
 session = s;
 try { if (s) localStorage.setItem('od_gestion', JSON.stringify({refresh_token: s.refresh_token})); else localStorage.removeItem('od_gestion'); } catch (e) {}
}
async function authCall(path, body) {
 const r = await fetch(URL_BASE + '/auth/v1/' + path, {method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json'}, body:JSON.stringify(body)});
 const j = await r.json().catch(() => ({}));
 if (!r.ok) throw new Error(j.error_description || j.msg || 'Erreur de connexion');
 return j;
}
async function refreshSession() {
 let rt = null;
 try { rt = JSON.parse(localStorage.getItem('od_gestion') || 'null')?.refresh_token; } catch (e) {}
 if (!rt) return false;
 try { saveSession(await authCall('token?grant_type=refresh_token', {refresh_token: rt})); return true; }
 catch (e) { saveSession(null); return false; }
}
async function api(method, path, body, extra) {
 const go = () => fetch(URL_BASE + path, {method, headers:Object.assign({apikey:KEY, Authorization:'Bearer ' + (session && session.access_token), 'Content-Type':'application/json'}, extra || {}), body: body ? JSON.stringify(body) : undefined});
 let r = await go();
 if (r.status === 401 && await refreshSession()) r = await go();
 if (r.status === 401) { showLogin('Session expirée. Reconnectez-vous.'); throw new Error('401'); }
 return r;
}

/* ---------- affichage connexion / app ---------- */
function showLogin(message) {
 $('app').hidden = true; $('login').hidden = false; $('logout').hidden = true;
 $('login-msg').textContent = message || ''; $('password').value = '';
}
function showApp() { $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false; load(); }

$('signin').addEventListener('click', async () => {
 const b = $('signin'); $('login-msg').textContent = '';
 if (!$('email').value || !$('password').value) { $('login-msg').textContent = 'Entrez votre courriel et votre mot de passe.'; return; }
 b.disabled = true;
 try { saveSession(await authCall('token?grant_type=password', {email:$('email').value.trim(), password:$('password').value})); showApp(); }
 catch (e) { $('login-msg').textContent = 'Courriel ou mot de passe incorrect.'; }
 finally { b.disabled = false; $('password').value = ''; }
});
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') $('signin').click(); });
$('logout').addEventListener('click', async () => {
 try { if (session) await fetch(URL_BASE + '/auth/v1/logout', {method:'POST', headers:{apikey:KEY, Authorization:'Bearer ' + session.access_token}}); } catch (e) {}
 saveSession(null); rows = []; showLogin('Vous êtes déconnecté.');
});

/* ---------- données ---------- */
async function load() {
 $('app-msg').textContent = ''; $('app-msg').className = 'msg';
 try {
  const r = await api('GET', '/rest/v1/demande?select=*&order=created_at.desc.nullslast&limit=500');
  if (!r.ok) { console.error(await r.text()); throw new Error(); }
  rows = await r.json();
  if (rows.length && rows[0].id == null) { $('app-msg').textContent = 'La table « demande » n’a pas de colonne « id » : les modifications sont impossibles.'; }
  buildFilters(); render();
 } catch (e) { if (e.message !== '401') $('app-msg').textContent = 'Impossible de charger les demandes. Réessayez dans un instant.'; }
}
function buildFilters() {
 const s = $('fstatut'), v = $('fville'), cs = s.value, cv = v.value;
 s.replaceChildren(el('option', {value:'', text:'Tous les statuts'}), ...STATUTS.map(([k,l]) => el('option', {value:k, text:l})));
 const villes = [...new Set(rows.map(r => (r.ville || '').trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'fr'));
 v.replaceChildren(el('option', {value:'', text:'Toutes les villes'}), ...villes.map(x => el('option', {value:x, text:x})));
 s.value = cs; v.value = cv;
}
function render() {
 const n = k => rows.filter(r => (r.statut || 'nouvelle') === k).length;
 $('stats').replaceChildren(...[[n('nouvelle'),'À traiter'],[n('contactee') + n('soumission_envoyee'),'En attente de réponse'],[n('planifiee'),'Planifiées'],[rows.length,'Total des demandes']]
  .map(([a,b]) => el('div', {class:'stat'}, el('strong', {text:String(a)}), el('span', {text:b}))));
 const q = $('q').value.trim().toLowerCase(), fs = $('fstatut').value, fv = $('fville').value;
 const shown = rows.filter(r => (!fs || (r.statut || 'nouvelle') === fs) && (!fv || (r.ville || '').trim() === fv) &&
  (!q || [r.nom, r.telephone, r.email, r.adresse, r.ville].some(x => String(x || '').toLowerCase().includes(q))));
 if (!shown.length) { $('list').replaceChildren(el('div', {class:'empty', text: rows.length ? 'Aucune demande ne correspond à ces filtres.' : 'Aucune demande pour le moment.'})); return; }
 $('list').replaceChildren(...shown.map(r => {
  const st = r.statut || 'nouvelle';
  return el('button', {class:'card', type:'button', onclick:() => openSheet(r)},
   el('div', {class:'row1'}, el('span', {class:'name', text:r.nom || 'Sans nom'}), el('span', {class:'badge s-' + st, text:LABEL[st] || st})),
   el('span', {class:'meta', text:[r.ville, r.type_debarras, r.volume].filter(Boolean).join(' · ')}),
   el('span', {class:'meta', text:'Date souhaitée : ' + fmtDate(r.date_souhaitee) + (r.plage_horaire ? ' · ' + r.plage_horaire : '')}),
   el('span', {class:'meta', text:'Reçue le ' + fmtDateTime(r.created_at)}));
 }));
}
['q','fstatut','fville'].forEach(i => $(i).addEventListener('input', render));
$('refresh').addEventListener('click', load);

/* ---------- fiche ---------- */
async function openSheet(r) {
 const body = $('sheet-body'), st = r.statut || 'nouvelle';
 const info = [['Téléphone', r.telephone],['Courriel', r.email],['Adresse', [r.adresse, r.ville].filter(Boolean).join(', ')],['Type de débarras', r.type_debarras],['Volume', r.volume],
  ['Escaliers', r.escaliers],['Étage', r.etage],['Date souhaitée', fmtDate(r.date_souhaitee)],['Plage horaire', r.plage_horaire],['Commentaires', r.commentaires],['Reçue le', fmtDateTime(r.created_at)]]
  .filter(([,v]) => v != null && v !== '');
 const dl = el('dl'); info.forEach(([k,v]) => dl.append(el('dt', {text:k}), el('dd', {text:String(v)})));
 const phone = digits(r.telephone);
 const quick = el('div', {class:'quick'},
  phone ? el('a', {class:'btn primary', href:'tel:' + phone, text:'Appeler'}) : null,
  r.email ? el('a', {class:'btn', href:'mailto:' + encodeURIComponent(r.email).replace('%40','@'), text:'Écrire un courriel'}) : null);
 const photos = el('div', {class:'photos', 'aria-label':'Photos du client'});
 const sel = el('select', {id:'f-statut'}, ...STATUTS.map(([k,l]) => el('option', {value:k, text:l})));
 sel.value = st;
 const prix = el('input', {id:'f-prix', type:'number', min:'0', step:'5', inputmode:'decimal'}); prix.value = r.prix ?? '';
 const notes = el('textarea', {id:'f-notes', maxlength:'2000'}); notes.value = r.notes || '';
 const msg = el('p', {class:'msg', role:'alert'});
 const save = el('button', {class:'primary', type:'button', text:'Enregistrer'});
 const del = el('button', {class:'danger', type:'button', text:'Supprimer'});
 save.addEventListener('click', async () => {
  save.disabled = true; msg.className = 'msg'; msg.textContent = '';
  try {
   const p = prix.value === '' ? null : Number(prix.value);
   if (p !== null && !(p >= 0)) throw new Error('Prix invalide.');
   const r2 = await api('PATCH', '/rest/v1/demande?id=eq.' + encodeURIComponent(r.id), {statut:sel.value, prix:p, notes:notes.value.trim() || null}, {Prefer:'return=minimal'});
   if (!r2.ok) { console.error(await r2.text()); throw new Error('Enregistrement impossible.'); }
   Object.assign(r, {statut:sel.value, prix:p, notes:notes.value.trim() || null});
   render(); msg.className = 'msg ok'; msg.textContent = 'Enregistré.';
  } catch (e) { if (e.message !== '401') msg.textContent = e.message; }
  finally { save.disabled = false; }
 });
 del.addEventListener('click', async () => {
  if (!confirm('Supprimer définitivement la demande de ' + (r.nom || 'ce client') + ' ?')) return;
  del.disabled = true;
  try {
   const r2 = await api('DELETE', '/rest/v1/demande?id=eq.' + encodeURIComponent(r.id), null, {Prefer:'return=minimal'});
   if (!r2.ok) throw new Error('Suppression impossible.');
   rows = rows.filter(x => x !== r); buildFilters(); render(); $('sheet').close();
  } catch (e) { if (e.message !== '401') { msg.textContent = e.message; del.disabled = false; } }
 });
 const close = el('button', {class:'close', type:'button', text:'Fermer', onclick:() => $('sheet').close()});
 body.replaceChildren(
  el('div', {class:'sheet-head'}, el('div', {}, el('h2', {text:r.nom || 'Sans nom'}), el('span', {class:'badge s-' + st, text:LABEL[st] || st})), close),
  quick, dl,
  Array.isArray(r.photos) && r.photos.length ? el('div', {}, el('label', {text:'Photos (' + r.photos.length + ')'}), photos) : null,
  el('div', {class:'edit'},
   el('div', {}, el('label', {for:'f-statut', text:'Statut'}), sel),
   el('div', {}, el('label', {for:'f-prix', text:'Prix soumis ($)'}), prix),
   el('div', {class:'full'}, el('label', {for:'f-notes', text:'Notes privées'}), notes)),
  msg, el('div', {class:'sheet-actions'}, del, save));
 $('sheet').showModal();
 if (Array.isArray(r.photos) && r.photos.length) loadPhotos(r.photos, photos);
}
async function loadPhotos(paths, box) {
 try {
  const r = await api('POST', '/storage/v1/object/sign/' + BUCKET, {expiresIn:600, paths});
  if (!r.ok) throw new Error();
  const list = await r.json();
  box.replaceChildren(...list.filter(x => x.signedURL).map(x => {
   const u = URL_BASE + '/storage/v1' + x.signedURL;
   return el('a', {href:u, target:'_blank', rel:'noopener noreferrer'}, el('img', {src:u, alt:'Photo du client', loading:'lazy'}));
  }));
 } catch (e) { box.replaceChildren(el('span', {class:'muted', text:'Photos indisponibles.'})); }
}
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').close(); });

/* ---------- démarrage ---------- */
(async () => { if (await refreshSession()) showApp(); else showLogin(); })();
</script>
</body></html>
